name: Android CI / CD & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract App Version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected App Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  codeql:
    name: 🛡️ CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'java-kotlin'
          build-mode: 'manual'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build for CodeQL
        run: ./gradlew compileReleaseSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  build:
    name: 📦 Build Release (AAB & APK)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract App Version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected App Version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Configure Keystore (if GitHub Secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decryption of release keystore from secrets..."
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            cat <<EOF > keystore.properties
          storeFile=keystore/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore configured successfully."
          else
            echo "No keystore secrets found. Building unsigned release package."
          fi

      - name: Build Release Bundle (AAB) & APK
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Prepare Versioned Packages
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$RELEASE_APK" "app/build/outputs/apk/release/kompas-v${APP_VERSION}.apk"
          echo "Created versioned APK: kompas-v${APP_VERSION}.apk"

          RELEASE_AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$RELEASE_AAB" "app/build/outputs/bundle/release/kompas-v${APP_VERSION}.aab"
          echo "Created versioned AAB: kompas-v${APP_VERSION}.aab"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: kompas-v${{ env.APP_VERSION }}-release-aab
          path: app/build/outputs/bundle/release/kompas-v${{ env.APP_VERSION }}.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kompas-v${{ env.APP_VERSION }}-release-apk
          path: app/build/outputs/apk/release/kompas-v${{ env.APP_VERSION }}.apk
          retention-days: 30
