version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      android-core:
        patterns:
          - "com.android.*"
          - "gradle-wrapper"
      compose-and-kotlin:
        patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
